name: Continuos Integration # dar um nome ao nosso fluxo de trabalho e criar nosso gatilho

on: 
  pull_request #evento que vai disparar esse workflow (ação)

jobs: #Jobs -> passo a passo que esse workflow vai realizar
  continuos-integration:
    runs-on: ubuntu-latest

    steps: #devidir os passos que estao dentro desse job
      - name: Baixar o código
      - uses: actions/checkout@v4

      - name: Configurar java 11 
          uses: actions/setup-java@v4
          with: 
            java-version: '11'
            distribution: 'temurin'

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Rodar os testes
        run: mvn test -B

      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias
          path: Evidencias/